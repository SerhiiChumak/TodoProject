{% extends 'todo/base.html' %}
{% block content %}
  <h1>{{ view.object|yesno:"Update,Create" }} tag</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'tag-list' %}" class="btn btn-secondary">Back</a>
  </form>
{% endblock %}
