{% extends 'todo/base.html' %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url 'tag-create' %}" class="btn btn-primary">Add tag</a>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Name</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url 'tag-update' tag.id %}" class="btn btn-sm btn-secondary">Update</a>
          <a href="{% url 'tag-delete' tag.id %}" class="btn btn-sm btn-danger">Delete</a>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
